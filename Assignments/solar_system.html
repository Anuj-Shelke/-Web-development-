<head>

        }
        #venus{
            height : 80px ;

            height : 80px ; 
            width : 80px;

            background-color:darkblue; 
            position : fixed; 
            top: 300px ; 
            right : 125px ; 
            animation-name: planet;
            animation-duration: 5s ;
            animation-iteration-count: infinite ;
        }
        nep{
            border-radius: 50%; 
            height : 800px ; 
            width : 800px; 
            border: 2px solid black ;
            top : 300px ; 
            right : 125px ; 


        }
        @keyframes planet{
             from {
                rotate: (0deg); 
             }
             to{
                rotate: (360deg); 
             }
        }


    </style>
</head>
<body>
    <div id ="nep">

    <div id = "saturn"></div>

</body>
</html>
