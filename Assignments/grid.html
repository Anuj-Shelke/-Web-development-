<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        
        #parent{
            display : grid ; 
            border : 2px solid ; 
            height : 400px ; 
            width : 400px ; 
            grid-column: span;
            grid-template-columns: 1fr 1fr 1fr ;
            grid-template-rows: 1fr 1fr 1fr; 

        }
        .box{
           border : 2px solid black ; 
           background-color: aqua ;
           grid-column : span;
        }
        #Special{
            background-color : darkblue ; 
        }
    </style>

</head>
<body>
    <div id = "parent">
        <div class = "box"></div>
        <div class = "box"></div>
        <div class = "box"></div>
        <div class = "box"></div>
        <div class = "box"></div>
        <div class = "box"></div>
        <div class = "box"></div>
        <div class = "box"></div>

        
      <div id = "Special" class = "box"></div>

    </div>
    
</body>
</html>
